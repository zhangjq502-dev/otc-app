# Render Blueprint：一个 Node 服务同时提供 REST API、WebSocket 和 H5 页面（server/public）
services:
  - type: web
    name: otc-app
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npx --yes pnpm@12.4.2 install --frozen-lockfile
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SIMULATE_MERCHANT
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
