<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟资产管理</title>
<style>body{font:16px system-ui;background:#f5f5f5;margin:0;color:#202530}main{max-width:420px;margin:50px auto;padding:28px;background:white;border-radius:16px}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;font:inherit;border:1px solid #ddd;border-radius:8px}button{background:#f0b90b;cursor:pointer}p{line-height:1.6}#result{white-space:pre-wrap}small{color:#666}</style>
<main><h2>模拟资产管理</h2><small>仅调整项目内模拟余额，不涉及真实资金。</small><form id="login"><input name="username" autocomplete="username" placeholder="管理员账号" required><input name="password" type="password" autocomplete="current-password" placeholder="密码" required><button>管理员登录</button></form><section id="directory" hidden><h3>注册用户</h3><input id="search" placeholder="搜索用户名"><button id="query">查询</button><p id="count"></p><div id="users"></div><button id="prev">上一页</button><button id="next">下一页</button></section><form id="credit" hidden><input name="username" placeholder="目标用户名" required><select name="coin"><option>USDT</option><option>BTC</option><option>ETH</option></select><input name="amount" type="number" step="any" min="0.000001" max="1000000" placeholder="充值数量" required><button>增加模拟余额</button><button type="button" id="logout">退出登录</button></form><p id="result" role="status"></p></main>
<script>
let token=sessionStorage.getItem('otc_admin_session')||'',page=1,total=0;
sessionStorage.removeItem('otc_admin_session');
const login=document.querySelector('#login'),credit=document.querySelector('#credit'),result=document.querySelector('#result'),directory=document.querySelector('#directory');
async function call(path,data){const res=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(data?{body:JSON.stringify(data)}:{})});const body=await res.json();if(!res.ok||body.code!==0)throw new Error(body.message||'请求失败');return body.data}
async function users(p=1){const d=await call('/api/admin/users?page='+p+'&search='+encodeURIComponent(document.querySelector('#search').value));page=d.page;total=d.total;document.querySelector('#count').textContent='共 '+total+' 位用户 · 第 '+page+' 页';const container=document.querySelector('#users');container.replaceChildren();for(const user of d.users){const box=document.createElement('div');box.style='padding:16px 0;border-bottom:1px solid #ddd';const name=document.createElement('strong');name.textContent=user.username+(user.role==='admin'?'（管理员）':'');box.append(name);for(const [coin,a]of Object.entries(user.assets)){const line=document.createElement('p');line.textContent=coin+' 可用 '+a.available+' / 冻结 '+a.frozen;box.append(line)}const select=document.createElement('button');select.textContent='给此用户充值';select.onclick=()=>{credit.elements.username.value=user.username;credit.scrollIntoView({behavior:'smooth'})};box.append(select);container.append(box)}document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page*20>=total}
async function enter(){const me=await call('/api/user/me');if(me.role!=='admin')throw new Error('需要管理员权限');await users();login.hidden=true;credit.hidden=false;directory.hidden=false;result.textContent='已登录管理员'}
login.onsubmit=async e=>{e.preventDefault();const button=login.querySelector('button');button.disabled=true;try{const d=await call('/api/auth/login',Object.fromEntries(new FormData(login)));if(d.user.role!=='admin')throw new Error('该账号没有管理权限');token=d.token;await enter();login.reset()}catch(e){token='';result.textContent=e.message}finally{button.disabled=false}};
credit.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(credit));if(!confirm('给 '+data.username+' 增加 '+data.amount+' '+data.coin+' 模拟余额？'))return;const button=credit.querySelector('button');button.disabled=true;try{const d=await call('/api/admin/credits',data);result.textContent='操作成功：'+d.user.username+' 的 '+d.coin+' 可用余额为 '+d.user.assets[d.coin].available;credit.elements.amount.value='';await users(page)}catch(e){result.textContent=e.message+'。网络异常时先检查余额，避免重复充值。'}finally{button.disabled=false}};
document.querySelector('#query').onclick=()=>users().catch(e=>result.textContent=e.message);document.querySelector('#prev').onclick=()=>users(page-1).catch(e=>result.textContent=e.message);document.querySelector('#next').onclick=()=>users(page+1).catch(e=>result.textContent=e.message);
document.querySelector('#logout').onclick=()=>{token='';credit.hidden=true;directory.hidden=true;login.hidden=false;location.assign('/#/pages/login/login')};
if(token)enter().catch(e=>{token='';result.textContent=e.message+'，请重新登录'});
</script></html>
