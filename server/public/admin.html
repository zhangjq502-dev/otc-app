<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟资产管理</title>
<style>body{font:16px system-ui;background:#f5f5f5;margin:0;color:#202530}main{max-width:420px;margin:50px auto;padding:28px;background:white;border-radius:16px}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;font:inherit;border:1px solid #ddd;border-radius:8px}button{background:#f0b90b;cursor:pointer}p{line-height:1.6}#result{white-space:pre-wrap}small{color:#666}</style>
<main><h2>模拟资产管理</h2><small>仅调整项目内模拟余额，不涉及真实资金。</small><form id="login"><input name="username" autocomplete="username" placeholder="管理员账号" required><input name="password" type="password" autocomplete="current-password" placeholder="密码" required><button>管理员登录</button></form><form id="credit" hidden><input name="username" placeholder="目标用户名" required><select name="coin"><option>USDT</option><option>BTC</option><option>ETH</option></select><input name="amount" type="number" step="any" min="0.000001" max="1000000" placeholder="充值数量" required><button>增加模拟余额</button><button type="button" id="logout">退出登录</button></form><p id="result" role="status"></p></main>
<script>
let token='';const login=document.querySelector('#login'),credit=document.querySelector('#credit'),result=document.querySelector('#result');
async function call(path,data){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(data)});const body=await res.json();if(!res.ok||body.code!==0)throw new Error(body.message||'请求失败');return body.data}
login.onsubmit=async e=>{e.preventDefault();const button=login.querySelector('button');button.disabled=true;try{const d=await call('/api/auth/login',Object.fromEntries(new FormData(login)));if(d.user.role!=='admin')throw new Error('该账号没有管理权限');token=d.token;login.reset();login.hidden=true;credit.hidden=false;result.textContent='已登录'}catch(e){result.textContent=e.message}finally{button.disabled=false}};
credit.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(credit));if(!confirm('给 '+data.username+' 增加 '+data.amount+' '+data.coin+' 模拟余额？'))return;const button=credit.querySelector('button');button.disabled=true;try{const d=await call('/api/admin/credits',data);result.textContent='操作成功：'+d.user.username+' 的 '+d.coin+' 可用余额为 '+d.user.assets[d.coin].available;credit.reset()}catch(e){result.textContent=e.message+'。网络异常时先检查余额，避免重复充值。'}finally{button.disabled=false}};
document.querySelector('#logout').onclick=()=>{token='';credit.hidden=true;login.hidden=false;result.textContent='已退出'};
</script></html>
