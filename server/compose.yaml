services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: otc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
      POSTGRES_DB: otc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - otc_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otc -d otc"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  otc_postgres:
